name: Incident ML checks

on:
  push:
    paths: ['ml/incident_classifier/**', '.github/workflows/incident-ml.yml']
  pull_request:
    paths: ['ml/incident_classifier/**', '.github/workflows/incident-ml.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: ml/incident_classifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Exercise the full pipeline
        run: |
          python -m incident_ml.cli train --data data/synthetic_incidents.jsonl --output artifacts/ci-model
          python -m incident_ml.cli evaluate --data data/synthetic_incidents.jsonl --model artifacts/ci-model
          python -m incident_ml.cli predict --model artifacts/ci-model --text "Smoke and flames inside a building"

      - name: Exercise batch inference
        run: |
          python -m incident_ml.cli batch-predict --model artifacts/ci-model --input examples/batch_input.jsonl --output artifacts/predictions.jsonl --batch-size 2
          python -c "import json; from pathlib import Path; rows = [json.loads(line) for line in Path('artifacts/predictions.jsonl').read_text().splitlines()]; assert len(rows) == 3; assert all(row['status'] == 'ok' for row in rows); assert rows[-1]['prediction']['requires_review']"

      - name: Exercise training-only model comparison
        run: |
          python -m incident_ml.cli cross-validate --data data/synthetic_incidents.jsonl > artifacts/comparison.json
          python -c "import json; from pathlib import Path; r = json.loads(Path('artifacts/comparison.json').read_text()); assert r['training_records'] == 48; assert len(r['folds']) == 3; assert all(m['out_of_fold']['samples'] == 48 for m in r['models'].values())"

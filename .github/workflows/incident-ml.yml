name: Incident ML checks

on:
  push:
    paths: ['ml/incident_classifier/**', '.github/workflows/incident-ml.yml']
  pull_request:
    paths: ['ml/incident_classifier/**', '.github/workflows/incident-ml.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: ml/incident_classifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Exercise the full pipeline
        run: |
          python -m incident_ml.cli train --data data/synthetic_incidents.jsonl --output artifacts/ci-model
          python -m incident_ml.cli evaluate --data data/synthetic_incidents.jsonl --model artifacts/ci-model
          python -m incident_ml.cli predict --model artifacts/ci-model --text "Smoke and flames inside a building"

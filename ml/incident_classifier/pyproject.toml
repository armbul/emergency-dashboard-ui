[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-ml"
version = "0.1.0"
description = "A reproducible, CPU-friendly neural incident classification research baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
incident-ml = "incident_ml.cli:main"

[tool.setuptools.packages.find]
include = ["incident_ml*"]
